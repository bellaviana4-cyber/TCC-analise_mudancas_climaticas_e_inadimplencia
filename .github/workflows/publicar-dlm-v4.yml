name: publicar arquivos completos do dlm v4
on:
  push:
    branches: [main]
    paths:
      - 'outputs/archive_dlm_v4/*.b64'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: restaurar resultados originais
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib
          records = {
            'outputs/archive_dlm_v4/relatorio_tcc_fechamento_dlm_v4.html.gz.b64': (
              'outputs/reports/relatorio_tcc_fechamento_dlm_v4.html',
              '16075121981bec844a100f0e603bec7f9145d5b726de6dcebcc55b9598b34b5c'
            ),
            'outputs/archive_dlm_v4/coeficientes_todos_K.csv.gz.b64': (
              'outputs/tables/dlm_inferencia_banda_regra_v3/coeficientes_todos_K.csv',
              'e10bc59b91fa9ffa62cd72ca32830deb9bf02c625f27864a44c1ce340b4d8a15'
            ),
          }
          for source,(target,expected_sha) in records.items():
              raw=gzip.decompress(base64.b64decode(Path(source).read_text().strip()))
              actual=hashlib.sha256(raw).hexdigest()
              if actual != expected_sha:
                  raise RuntimeError(f'integridade inválida: {target}')
              path=Path(target); path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
              print(f'{target}: {len(raw)} bytes, sha256 OK')
          PY
      - name: publicar saídas sem perder histórico
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/reports/relatorio_tcc_fechamento_dlm_v4.html outputs/tables/dlm_inferencia_banda_regra_v3/coeficientes_todos_K.csv
          git rm -f outputs/archive_dlm_v4/*.b64
          git diff --cached --quiet || git commit -m "publica relatório e tabela completa do dlm v4"
          git push origin HEAD:main
