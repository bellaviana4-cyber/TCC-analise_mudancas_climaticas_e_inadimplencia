name: sarimax nacional
on:
  push:
    branches: [analise/sarimax-nacional]
    paths:
      - "docs/sarimax_protocolo.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  executar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analise/sarimax-nacional
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install "numpy<3" pandas scipy statsmodels matplotlib
      - name: executar sarimax e verificar saidas
        run: |
          python src/sarimax_diagnostico.py | tee sarimax_triagem.txt
          python src/sarimax.py | tee sarimax_execucao.txt
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          base = Path("outputs/tables/sarimax")
          for f in ["candidatos.csv", "modelos.csv", "coeficientes.csv",
                    "diagnosticos.csv", "metricas.csv", "previsoes.csv",
                    "estacionariedade.csv", "suporte.csv", "resumo.json"]:
              assert (base / f).exists(), f
          assert pd.read_csv(base / "previsoes.csv")["data"].nunique() == 24
          assert Path("outputs/reports/relatorio_sarimax.html").exists()
          print(json.loads((base / "resumo.json").read_text(encoding="utf-8")))
          PY
      - name: publicar tabelas, figuras e relatorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/tables/sarimax outputs/figures/sarimax outputs/reports/relatorio_sarimax.html
          if ! git diff --staged --quiet; then
            git commit -m "publica resultados do sarimax"
            git push origin HEAD:analise/sarimax-nacional
          fi
      - name: guardar log de execucao
        uses: actions/upload-artifact@v4
        with:
          name: sarimax-log
          path: |
            sarimax_execucao.txt
            sarimax_triagem.txt
